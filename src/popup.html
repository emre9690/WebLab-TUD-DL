<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 360px; margin: 0; padding: 14px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #222; }
      h1 { font-size: 15px; margin: 0; }
      #course { color: #666; margin: 2px 0 10px; min-height: 1em; }
      #tree { border: 1px solid #ddd; border-radius: 6px; max-height: 340px; min-height: 60px; overflow-y: auto; padding: 4px 0; margin-bottom: 10px; }
      ul { list-style: none; margin: 0; padding: 0; }
      ul ul { padding-left: 18px; }
      .row { display: flex; align-items: center; gap: 4px; padding: 2px 8px; }
      .row:hover { background: #f3f6f8; }
      .twisty { width: 16px; flex: none; border: 0; background: none; padding: 0; color: #888; cursor: pointer; font-size: 11px; }
      .twisty[disabled] { cursor: default; visibility: hidden; }
      .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; flex: 1; min-width: 0; }
      .row label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .question span { color: #555; }
      .note { color: #888; padding: 2px 8px 2px 28px; font-size: 12px; }
      .count { flex: none; color: #888; font-size: 11px; }
      #selected { margin-bottom: 10px; }
      #selected h2 { font-size: 12px; font-weight: 600; margin: 0 0 4px; color: #444; }
      #selected .item { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
      #selected .item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #333; }
      #selected .item button { flex: none; border: 0; background: none; color: #999; cursor: pointer; font-size: 14px; padding: 0 4px; }
      #selected .item button:hover { color: #c33; }
      .opt { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; cursor: pointer; }
      .opt small { display: block; color: #777; }
      .opt input { margin-top: 2px; }
      button#go { width: 100%; padding: 8px; font: inherit; font-weight: 600; color: #fff; background: #00a6d6; border: 0; border-radius: 6px; cursor: pointer; }
      button#go:disabled { background: #9bb; cursor: default; }
      #msg { margin-top: 10px; color: #a33; min-height: 1em; }
    </style>
  </head>
  <body>
    <h1>WebLab Downloader</h1>
    <div id="course"></div>
    <div id="tree"><div class="note">Loading folders…</div></div>
    <div id="selected"></div>

    <label class="opt">
      <input type="checkbox" id="includeMine" />
      <span>Include my answers<small>What you filled in or selected, with WebLab's ✓/✗ if shown. Published model answers are always included.</small></span>
    </label>

    <button id="go" disabled>Download for AI</button>
    <div id="msg"></div>
    <script src="popup.js"></script>
  </body>
</html>
